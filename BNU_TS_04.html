    html.mm-dark math {

    /* 核心修复：iOS / iPadOS / macOS Safari WebKit 内核在经过 D3 transform 的 SVG <foreignObject> 内，
       会将带 position:relative/absolute (如 KaTeX 的 .vlist-t / .msupsub / .mfrac) 的子节点全部渲染到 SVG 画布左上角 (0,0)！
       而 Safari / WebKit 原生支持高质量 MathML（不依赖 position:relative/absolute），在 foreignObject 中坐标 100% 跟随节点！ */
    html.is-webkit .katex-html {
      display: none !important;
    }
    html.is-webkit .katex-mathml {
      position: static !important;
      clip: auto !important;
      clip-path: none !important;
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
      display: inline !important;
      border: 0 !important;
      padding: 0 !important;
    }
    html.is-webkit .katex-mathml math {
      display: inline !important;
      font-size: 1.05em;
    }

# Time Series Analysis, Lecture 4

## Autoregressive ($\text{AR}(p)$) Models & Causality
- **Operator Form**: $\phi(B)x_t = w_t$ where $\phi(B) = 1 - \phi_1 B - \cdots - \phi_p B^p$
- **Causality Definition**: $x_t = \sum_{j=0}^\infty \psi_j w_{t-j}$ with $\sum_{j=0}^\infty |\psi_j| < \infty$ (does not depend on future shocks)
- **Characteristic Polynomial**: $\phi(z) = 1 - \phi_1 z - \cdots - \phi_p z^p$
- **Causality Theorem**: $\text{AR}(p)$ is causal iff $\phi(z) \neq 0$ for all $|z| \le 1$ (all roots lie outside the unit circle)
- **AR(1) & AR(2) Conditions**: AR(1) requires $|\phi| < 1$; AR(2) requires $\phi_2 - \phi_1 < 1$, $\phi_1 + \phi_2 < 1$, $|\phi_2| < 1$
- **Computing $\psi_j$**: Match powers of $z$ in $\phi(z)\psi(z) = 1$ (for AR(1), $\psi_j = \phi^j$)

## Moving Average ($\text{MA}(q)$) Models & Invertibility
- **$\text{MA}(q)$ Definition**: $x_t = \theta(B)w_t = w_t + \theta_1 w_{t-1} + \cdots + \theta_q w_{t-q}$ ($\theta_q \neq 0$); always stationary
- **MA(1) ACF**: $\gamma(0) = (1 + \theta^2)\sigma_w^2$, $\gamma(1) = \theta\sigma_w^2$, $\rho(1) = \frac{\theta}{1 + \theta^2}$, $\rho(h) = 0$ ($h > 1$)
- **Non-Uniqueness**: $\theta$ and $1/\theta$ yield identical $\rho(h)$ (e.g., $\theta=5, \sigma_w^2=1$ vs $\theta=1/5, \sigma_w^2=25$)
- **Invertibility Definition**: $w_t = \sum_{j=0}^\infty \pi_j x_{t-j} = \theta^{-1}(B)x_t$ with $\sum_{j=0}^\infty |\pi_j| < \infty$
- **Invertibility Condition**: $\theta(z) \neq 0$ for all $|z| \le 1$ (roots of $\theta(z)$ lie outside the unit circle; $|\theta| < 1$ for MA(1))

## Autoregressive Moving Average ($\text{ARMA}(p, q)$) Models
- **Definition**: Stationary $x_t$ satisfying $\phi(B)x_t = \theta(B)w_t$ ($\phi_p \neq 0$, $\theta_q \neq 0$)
- **Nonzero Mean**: $x_t = \alpha + \sum_{i=1}^p \phi_i x_{t-i} + w_t + \sum_{j=1}^q \theta_j w_{t-j}$ with $\alpha = \mu(1 - \sum_{i=1}^p \phi_i)$
- **Parameter Redundancy**: Multiplying both sides by $\eta(B)$ creates over-parameterized models (e.g., white noise disguised as ARMA(1,1))
- **Formal Identification**: Require $\phi(z)$ and $\theta(z)$ to have **no common factors**
  </script>

  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.17.2/dist/browser/index.iife.js" onerror="document.write('<script src=&quot;https://unpkg.com/markmap-lib@0.17.2/dist/browser/index.iife.js&quot;><\/script>')"></script>
  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
