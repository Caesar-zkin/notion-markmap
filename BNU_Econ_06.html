# Ch06 双重差分模型I：基础

## 第一节 故事背景与方法本质

### 1.1 政策评估与直觉
- **典型案例**: Kiel & McClain (1995) 垃圾焚烧站对房价的影响、Card & Krueger (1994) 最低工资对就业的影响
- **双重差分核心思想**: 通过“处理组 vs 对照组”和“政策前 vs 政策后”两次差分，剥离组间固有差异与共同时间趋势，识别政策净效应
- **两大适用前提**: 至少两期面板（或可构造队列的截面）数据；政策冲击非“一刀切”（存在处理组与对照组）
- **方法本质**: 双重差分法本质上是面板数据的双向固定效应（TWFE）估计

## 第二节 两期模型表达与基本原理

### 2.1 两种等价的两期模型
- **个体效应一阶差分形式**: $y_{it} = \alpha + \gamma D_t + \beta x_{it} + u_i + \varepsilon_{it}$（$t=1,2$），一阶差分 $\Delta y_i = \gamma + \beta x_{i2} + \Delta\varepsilon_i$ 消去 $u_i$ 后 OLS
- **分组-分期交互项形式**: $y_{it} = \beta_0 + \beta_1 G_i \times D_t + \beta_2 G_i + \gamma D_t + \varepsilon_{it}$，其中 $G_i$ 控制组间差异，$D_t$ 控制时间趋势，$G_i \times D_t$ 系数 $\beta_1$ 为政策净效应

### 2.2 双重差分的计算与控制变量
- **两次差分公式**: $\hat{\beta}_{DID} = (\bar{y}_{treat, 2} - \bar{y}_{treat, 1}) - (\bar{y}_{control, 2} - \bar{y}_{control, 1})$
- **引入协变量**: 加入随时间变化的控制变量 $Z_{it}$ 不改变 DID 基本原理，可提高估计精度并缓解组间趋势差异

## 第三节 多时期模型与常用表达

### 3.1 双向固定效应（TWFE）一般形式
- **表达方式 I（含交互项）**: $y_{it} = \beta_0 + \beta_1 G_i \times D_t + \delta X_{it} + \gamma_t + u_i + \varepsilon_{it}$，以个体固定效应 $u_i$ 和时间固定效应 $\gamma_t$ 分别替代粗糙的 $G_i$ 与 $D_t$
- **表达方式 II（单一处理虚拟变量）**: $y_{it} = \beta_0 + \beta_1 G_{it} + \delta X_{it} + \gamma_t + u_i + \varepsilon_{it}$，其中 $G_{it}=1$ 当且仅当个体处于处理组且在实验期
- **估计方法**: 使用 LSDV 或组内离差法吸收 $u_i$ 并加入全套时间虚拟变量 $\gamma_t$，标准误一般聚类在个体或更高宏观层级

## 第四节 前提假设与稳健性检验

### 4.1 共同趋势假定（平行趋势）
- **核心含义**: 无政策干预时，处理组与对照组的结果变量随时间具有相同的变化趋势 $\gamma_t$；违背会导致 $G_i\theta_t$ 进入扰动项引发内生性
- **识别方法 1（画图）**: 绘制政策前处理组与对照组均值时间趋势图，观察走势是否平行
- **识别方法 2（事件研究法回归）**: 引入分组变量与政策前各期虚拟变量的交互项，检验事前各期系数是否联合不显著异于 0
- **违背应对**: 增加控制变量、加入个体时间趋势项 $\theta_i t$、采用三重差分（DDD）或更换识别策略

### 4.2 政策外生性与预期效应
- **政策外生性**: 要求 $\varepsilon_{it}$ 与 $G_i \times D_t$ 不相关（允许 $u_i$ 与政策相关），且政策实施前个体未形成预期反应
- **预期效应检验**: 加入政策实施前一年虚拟变量与处理组的交互项，若不显著则无预期效应；若政策本身内生可结合 IV 解决

### 4.3 安慰剂检验（Placebo Test）
- **虚构政策时间**: 将政策时点提前至未发生干预的年份回归，系数应不显著
- **虚构处理组**: 剔除真实处理组或随机抽取模拟处理组重复 500/1000 次（La Ferrara et al., 2012），检验伪估计系数分布是否集中于 0 附近

## 第五节 Stata 实现
- **双向固定效应回归**: `reg y did x i.id i.time, vce(cluster id)` 或高效命令 `areg y did x i.time, absorb(id) vce(cluster id)`
- **直接命令**: 外部命令 `diff y, treat() period() cov() robust`；Stata 17+ 官方命令 `xtdidregress`（支持面板 DID/DDD 与平行趋势图）及 `didregress`（重复截面）
- **辅助检验**: 生成 `pre_*` / `post_*` 交互项配合 `coefplot` 绘制平行趋势图；循环抽样结合 `kdensity` 绘制安慰剂检验分布图

  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
