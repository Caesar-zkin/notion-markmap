# 第1章 回归分析概述

## 课程导言
### 历史渊源与核心思想
- **最小二乘法**: Gauss (1809) 提出；Galton (1886) 发表《遗传结构中向中心的回归》
- **回归分析定义**: 处理变量间相关关系的统计方法与技术 (*study of dependence*)
- **统计分析五问**: 是否相关 $\to$ 强度如何 $\to$ 总体是否成立 $\to$ 模型描述 $\to$ 是否因果
### 典型案例
- **例 1.1 火灾损失**: 损失 $y$ 与距消防站距离 $x$ 呈线性关系 $\hat{y} = 10.2779 + 4.9193x$
- **例 1.2 生物种群**: 规模 $y$ 随时间 $x$ 呈 S 形曲线增长 $y = \frac{1}{a + be^{-x}}$ ($\hat{y} = \frac{1}{0.02 + 9.14e^{-x}}$)
### 课程安排
- **授课模式**: 方法原理讲解 + 案例分析 + 软件解决（陈菲菲，`chenfeifei@bnu.edu.cn`）
- **成绩构成**: 平时成绩 40%（考勤、表现、作业）+ 期末成绩 60%

## 1.1 “回归”名称的由来
- **遗传学回归**: Galton 与 Pearson 研究 1078 对夫妇身高，得 $\hat{y} = 33.73 + 0.516x$
- **向中心回归**: 子代身高有向族群平均身高靠拢（回归）的趋势

## 1.2 变量间的相关关系
### 两类数量依存关系
- **函数关系**: 确定性数量对应关系 $y = f(x_1, \dots, x_p)$，如 $S = \pi R^2$、$h = \frac{1}{2}gt^2$
- **相关关系**: 非确定性数量对应关系 $y = f(x_1, \dots, x_p, \epsilon)$，如空气中落体 $H = \frac{1}{2}gt^2 + \epsilon$
### 相关分析 vs 回归分析
- **相关分析**: 用相关系数度量相关方向与密切程度，不区分自变量与因变量
- **回归分析**: 确定自变量对因变量的具体影响形态（回归模型），是相关分析的深入与继续

## 1.3 回归模型的一般形式
- **一般形式**: $y = f(x_1, \dots, x_p, \epsilon)$，$y$ 为响应变量，$x$ 为解释变量，$\epsilon$ 为误差
- **误差结构**: 加性误差 $y = f(\mathbf{x}) + \epsilon$；乘性误差 $y = f(\mathbf{x}) \cdot \epsilon$
### 回归模型分类
- **参数回归模型**: $y = f(x_1, \dots, x_p, \beta) + \epsilon$，含一元/多元线性回归与非线性回归
- **半参数回归模型**: 兼具参数与非参数成分
- **非参数回归模型**: $y = f(x_1, \dots, x_p) + \epsilon$，不预设参数形式
### 线性回归模型特点与变量构成
- **模型优势**: 简单可解释、小样本/低信噪比下稳健、可通过变换推广、是非线性方法基础
- **变量形式**: 定量变量、变换变量（$\log x, \sqrt{x}$）、交互项（$x_1 x_2$）、基函数（$x_1^2, x_1^3$）、哑变量

## 1.4 回归模型的建立过程
- **标准流程**: 实际问题 $\to$ 设置指标 $\to$ 收集数据 $\to$ 构造理论模型 $\to$ 参数估计 $\to$ 模型诊断
- **诊断闭环**: 未通过诊断则修改指标/数据/模型；通过诊断则进入模型运用（影响因素分析、决策预测、变量控制）

  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
