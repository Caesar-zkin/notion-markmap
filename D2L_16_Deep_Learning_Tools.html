# 第16章 深度学习工具 (D2L)

## 16.1 使用 Jupyter Notebook
### 本地与远程工作流
- **内核与单元**: 运行 `jupyter notebook` 启动界面；同一 Notebook 共享内核状态，修改前置变量后需按依赖重跑（或 `Restart & Run All`）
- **远程端口转发**: 通过 `ssh myserver -L 8888:localhost:8888` 将远端 Notebook 端口映射至本地浏览器访问
- **教材扩展**: 使用 `d2l-notedown` 打开 Markdown 源文件，配合 ExecuteTime 插件展示单元耗时

## 16.2 使用 Amazon SageMaker
### 托管 Notebook 环境
- **实例配置**: 创建托管 Notebook 实例（如 V100 `ml.p3.2xlarge`），关联教材仓库 `d2l-ai/d2l-pytorch-sagemaker`
- **生命周期与安全**: 实验结束及时停止实例以控制费用；配置双因素认证、计费提醒，并在终端拉取更新

## 16.3 使用 Amazon EC2 实例
### 云端 GPU 实例管理
- **选区与配额**: 根据网络延迟与可用配额选择区域及 GPU 实例规格
- **SSH 与环境**: 选定 Linux 镜像并配置密钥（`chmod 400` 限制权限），连入后确认 GPU 驱动与框架识别正常
- **停止 vs 终止**: 区分临时停止（保留状态/存储）与彻底终止（释放资源），避免闲置计费

## 16.4 选择服务器和 GPU
### 硬件配置权衡
- **服务器架构**: 综合考虑 CPU 单核性能、内存、存储、电源散热及 PCIe 通道数（多卡时注意插槽实际带宽可能是 x8/x4）
- **GPU 三大指标**: 计算能力（算子吞吐）、显存容量（决定可容纳模型与批量大小）、显存带宽（影响数据供给速度）
- **卡型差异**: 结合散热方式、显存配置与机箱兼容性选择消费级卡或服务器级卡

## 16.5 为本书做贡献
### 开源协作规范
- **多框架标记**: 使用 `#@tab pytorch`、`#@tab tensorflow`、`#@tab paddle`、`#@tab all` 区分不同框架代码块
- **Git PR 流程**: Fork 上游仓库 $\to$ Clone 至本地修改验证 $\to$ 提交推送 $\to$ 发起 Pull Request 经 CI 检查与维护者审查合入

## 16.6 d2l API 文档
### 辅助库模块划分
- **核心模块**: 按模型类（前向计算）、数据工具（读入/预处理/分批）、训练工具（梯度更新/评估）及公用工具（绘图/计时）组织
- **源码定位**: PyTorch 版通过 `from d2l import torch as d2l` 导入，遇到封装细节可通过附录源码链接核对参数与形状

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" onerror="document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;><\/script>')"></script>

  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
