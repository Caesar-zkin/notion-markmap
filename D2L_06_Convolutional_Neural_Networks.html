# 第6章 卷积神经网络 (D2L)

## 6.1 从全连接层到卷积
### 位置共享与平移等变
- **平移等变性**: 无限网格步幅为 $1$ 时，$F(T_{\boldsymbol t}X)_{i,j}=(T_{\boldsymbol t}F(X))_{i,j}$，输出随输入同步平移
- **平移不变性**: 将特征图汇聚成分类预测后可进一步获得平移不变性
### 从全连接到局部连接
- **参数共享**: 令 $U_{i,j}=u$、$V_{i,j,a,b}=V_{a,b}$，并限制窗口半径 $\Delta$，参数量由 $(hw)^2$ 降至 $(2\Delta+1)^2$
- **多通道扩展**: 每个输出通道使用独立核覆盖全部输入通道
### 数学卷积与互相关
- **算子关系**: 二维互相关采用正向偏移，将核沿高和宽翻转即可与数学卷积互转

## 6.2 图像卷积
### 二维互相关与卷积层
- **互相关公式**: $Y_{i,j}=\sum_{a=0}^{k_h-1}\sum_{b=0}^{k_w-1}X_{i+a,j+b}K_{a,b}$
- **无填充输出尺寸**: $(h-k_h+1,\;w-k_w+1)$，卷积层将核与共享偏置作为可学习参数
### 边缘检测与学习卷积核
- **手工边缘检测**: $K=[1,-1]$ 对横向相邻像素求差，正负号区分亮暗变化方向
- **梯度学习核**: 最小化平方误差 $L=\frac{1}{2}\|\widehat Y-Y\|_F^2$，梯度 $G_{a,b}=\sum_{i,j}(\widehat Y_{i,j}-Y_{i,j})X_{i+a,j+b}$
### 特征映射和感受野
- **感受野扩展**: 两层 $3\times3$（步幅 $1$）卷积串联的有效感受野为 $5\times5$

## 6.3 填充和步幅
### 填充与尺寸公式
- **输出高宽公式**: $h_o=\lfloor(h+p_h-k_h)/s_h\rfloor+1$，$w_o=\lfloor(w+p_w-k_w)/s_w\rfloor+1$
- **保持分辨率**: 步幅为 $1$ 时取总填充 $p_h=k_h-1$、$p_w=k_w-1$（奇数核可对称分配）
### 步幅与 PyTorch 参数
- **PyTorch 写法**: `padding=(a,b)` 表示上下各补 $a$、左右各补 $b$；`stride=2` 常用于分辨率约减半

## 6.4 多输入多输出通道
### 通道求和与独立输出核
- **多通道互相关**: $Y_{d,i,j}=b_d+\sum_{c=0}^{c_i-1}\sum_{a,b}W_{d,c,a,b}X_{c,i+a,j+b}$
- **权重形状**: $(c_o, c_i, k_h, k_w)$，共 $c_o c_i k_h k_w$ 个权重与 $c_o$ 个偏置
### 逐像素的通道线性变换
- **1×1 卷积**: 等价于对每个空间位置做线性映射 $\mathbf y_{i,j}=A\mathbf x_{i,j}+\mathbf b$（$A\in\mathbb R^{c_o\times c_i}$），用于混合与调整通道数

## 6.5 汇聚层
### 最大汇聚与平均汇聚
- **窗口汇聚**: $Y^{\max}_{c,i,j}=\max_{a,b}X_{c,is_h+a,js_w+b}$，$Y^{\mathrm{avg}}_{c,i,j}=\frac{1}{k_hk_w}\sum_{a,b}X_{c,is_h+a,js_w+b}$
- **性质**: 无可学习参数、保持通道数不变，最大汇聚对窗口内小幅平移具有局部不变性
### 步幅、填充与下采样
- **默认行为**: `nn.MaxPool2d(2)` 默认步幅等于窗口尺寸 $2$，实现不重叠下采样
- **全局平均汇聚**: `nn.AdaptiveAvgPool2d((1, 1))` 将每个通道整个空间网格归约为单个标量

## 6.6 卷积神经网络（LeNet）
### 特征提取与分类
- **网络结构**: 两块 `Conv2d(5×5) → Sigmoid → AvgPool2d(2×2, s=2)`，后接三层全连接 `400 → 120 → 84 → 10`
- **形状流转**: $1\times28\times28 \to 6\times28\times28 \to 6\times14\times14 \to 16\times10\times10 \to 16\times5\times5 \to 400 \to 10$
### PyTorch 实现与训练
- **训练配置**: Xavier 初始化权重，小批量 SGD + `nn.CrossEntropyLoss()`，评估时切至 `eval()` 并关闭梯度

  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
