# 第12章 计算性能 (D2L)

## 12.1 编译器和解释器
### 命令式 vs 符号式编程
- **命令式编程**: 逐句执行并即时更新状态，便于 Python 调试，但频繁调用小算子受调度开销限制
- **符号式编程**: 先构建完整计算图再编译执行，支持常量折叠、算子重排与中间内存提前回收
- **混合式编程**: 先以普通 PyTorch 模块开发调试，再用 `torch.jit.script(net)` 编译为可序列化 TorchScript 模块

## 12.2 异步计算
### 队列提交与同步测量
- **前后端解耦**: Python 前端将 CUDA 操作提交至队列后立即返回，后端异步执行
- **精准计时**: 计时前需预热并在前后调用 `torch.cuda.synchronize(device)`；避免频繁调用 `.item()` 打断流水线
- **排队收益**: 逐次等待耗时 $N(t_1+t_2+t_3)$，批末等待理想耗时 $t_1 + Nt_2 + t_3$（需权衡显存存活张量）

## 12.3 自动并行
### 跨设备与通信重叠
- **跨设备并行**: 运行时依据依赖图调度多 GPU 独立任务，理想耗时接近 $\max(T_0, T_1)$
- **计算通信重叠**: 使用 `.to('cpu', non_blocking=True)` 使结果回传与下一轮计算重叠，读取前需确认同步完成

## 12.4 硬件基础
### 延迟、带宽与局部性
- **延迟与带宽**: 延迟指单次操作起止时间，带宽指单位时间传输量；顺序访问与分块提升缓存局部性
- **伪共享**: 多核心频繁写入同一缓存行内不同地址，触发缓存一致性流量拖慢性能
### CPU 向量化与 GPU 吞吐
- **SIMD 带宽需求**: 如 4 核 2GHz 每周期读 256 位向量需 $4\times 256/8 \times 2\text{GHz} = 256\,\mathrm{GB/s}$，高度依赖缓存复用
- **GPU 特性**: 大量计算单元 + 高带宽显存 + Tensor Core；训练需保留/重算激活，推断可用低精度
- **设备互连**: PCIe、NVLink 与网络带宽及拓扑决定跨设备通信瓶颈

## 12.5 多 GPU 训练（从零实现）
### 并行模式与梯度归约
- **数据并行 vs 模型并行**: 数据并行各卡存完整模型处理不同分片；模型并行将不同层拆分到不同设备
- **全局批量归约**: 局部梯度和 $\mathbf{g}_j = \sum_{i\in B_j}\nabla_{\mathbf{w}}\ell_i(\mathbf{w})$，全局平均 $\mathbf{g} = \frac{1}{B}\sum_{j=1}^k \mathbf{g}_j$
- **实现流程**: 广播初始参数 $\to$ `CrossEntropyLoss(reduction="none")` 分别反传 $\to$ 跨卡求和梯度并同步更新

## 12.6 多 GPU 简洁实现
### PyTorch DataParallel
- **接口封装**: 将模型放至主卡后用 `nn.DataParallel(net.to(main_device), device_ids=devices)` 包装
- **前向与反向**: 在批量维度自动切分输入，前向输出汇集到主卡，反向梯度自动累加至原模块参数
- **扩展性权衡**: 固定全局批量时增加卡数会缩小单卡分片，使通信开销占比上升

## 12.7 参数服务器
### 环形同步 (Ring AllReduce)
- **两阶段通信**: 将 $S$ 字节梯度分 $n$ 块，经 $n-1$ 步归约与 $n-1$ 步全交换完成所有卡同步
- **通信时间模型**: $T \approx 2(n-1)\alpha + \frac{2(n-1)}{n}\frac{S}{\beta}$，忽略延迟 $\alpha$ 时传输时间趋于 $2S/\beta$
### 多机参数服务器
- **分层同步**: 先机内 GPU 聚合再跨机传输，降低跨机通信量
- **分片与键值语义**: 均分参数至 $n$ 个服务器使单机负载降至 $\mathcal{O}(m/n)$；通过 `push` / `pull` 按键求和 $\mathbf{g}_i = \sum_{k,j}\mathbf{g}_{ijk}$

  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
