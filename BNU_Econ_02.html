# 第2章 因果效应与线性回归

## 第一节 条件期望函数的性质（CEF）

### 1.1 CEF 与全期望公式
- **条件期望函数 (CEF)**: $E[Y_i \mid X_i]$ 是随机变量 $X_i$ 的函数，也是随机变量，因果参数（ATE、ATT、ATC）均为其形式
- **全期望公式（迭代期望定律）**: $E[Y_i] = E[E[Y_i \mid X_i]]$；嵌套形式为 $E[Y_i \mid X_i] = E[E[Y_i \mid X_i, Z_i] \mid X_i]$

### 1.2 CEF 的三大基本性质
- **性质 1（CEF 分解特征）**: $Y_i = E[Y_i \mid X_i] + \epsilon_i$，其中 $E[\epsilon_i \mid X_i] = 0$，且 $\epsilon_i$ 与 $X_i$ 的任意函数 $h(X_i)$ 不相关
- **性质 2（方差分解公式）**: $\text{Var}(Y_i) = \text{Var}(E[Y_i \mid X_i]) + \text{Var}(\epsilon_i)$，可用于分解收入差距等贡献度
- **性质 3（最优预测性质）**: 在均方误差（MSE）最小意义下，$E[Y_i \mid X_i] = \arg\min_{m} E[(Y_i - m(X_i))^2]$，与 CEF 是否线性无关

## 第二节 线性回归与条件期望函数

### 2.1 总体回归函数与系数
- **总体回归系数**: $\beta = \arg\min_b E[(Y_i - X_i'b)^2] = E[X_i X_i']^{-1} E[X_i Y_i]$，一阶条件必然导出 $E[X_i e_i] = 0$
- **多元回归偏系数公式 (FWL 定理)**: $\beta_k = \frac{\text{Cov}(\tilde{X}_{ki}, Y_i)}{\text{Var}(\tilde{X}_{ki})}$，其中 $\tilde{X}_{ki}$ 是 $X_{ki}$ 对其他控制变量 $X_{-ki}$ 回归的残差

### 2.2 联系回归与 CEF 的两大定理
- **定理 1.1（线性 CEF 定理）**: 若 $E[Y_i \mid X_i] = X_i'\beta^*$ 为线性函数，则总体回归函数就是 CEF（$\beta = \beta^*$）
- **定理 1.2（回归—CEF 定理）**: 即使 CEF 非线性，总体回归函数 $X_i'\beta$ 仍是最小 MSE 意义上对 $E[Y_i \mid X_i]$ 的最优线性近似
- **加总数据等价性**: 由 $\beta = E[X_i X_i']^{-1} E[X_i E[Y_i \mid X_i]]$，利用分组均值加权最小二乘可得到与个体回归相同的斜率估计

## 第三节 回归与因果

### 3.1 简单回归的因果解释
- **潜在结果回归形式**: $Y_i = \alpha + \tau_{ATE} D_i + \epsilon_i$，其中 $\epsilon_i = \nu_{0i} + D_i(\nu_{1i} - \nu_{0i})$
- **识别条件**: 仅当均值独立性 $E[Y_{0i}\mid D_i=1] = E[Y_{0i}\mid D_i=0]$ 成立时 $\tau^{ols} = ATT$；仅当 $E[Y_{1i}\mid D_i=1] = E[Y_{1i}\mid D_i=0]$ 成立时 $\tau^{ols} = ATC$；两者同时成立时 $\tau^{ols} = ATE$

### 3.2 多元饱和回归与加权平均
- **多元饱和回归**: $Y_i = \tau D_i + \sum_x \alpha_x d_x + \epsilon_i$，回归系数为条件因果效应的方差加权平均 $\tau^{OLS} = E\left[\frac{\text{Var}(D_i \mid X_i)}{E[\text{Var}(D_i \mid X_i)]}\tau_X\right]$
- **条件均值独立性 (CMI)**: $E(Y_{0i}\mid X_i, D_i=1) = E(Y_{0i}\mid X_i, D_i=0)$ 与 $E(Y_{1i}\mid X_i, D_i=1) = E(Y_{1i}\mid X_i, D_i=0)$
- **条件独立性 (CIA / 非混杂性)**: $(Y_{0i}, Y_{1i}) \perp D_i \mid X_i$（强于 CMI，针对整个分布）

## 第四节 多元回归中控制变量的选择

### 4.1 核心原则与角色区分
- **目的**: 引入控制变量 $X$ 是为了满足 CIA 或 CMI（阻断后门路径），控制变量本身的系数无需具有因果解释
- **“好”的控制变量**: 发生在原因变量之前的潜在混杂因素（共同原因），或处于未观测混杂 $U \to Z \to X$ / $U \to Z \to Y$ 路径上能阻断后门的中介变量

### 4.2 “中性”控制变量
- **$X$ 的原因变量**: 不影响偏误，但会减少处理变量 $X$ 的变异，降低 ATE 估计精度
- **$Y$（或中介 $M$）的原因变量**: 不影响偏误，但会减少 $Y$ 的残差方差，提高 ATE 估计精度
- **$X$ 之后的某些后代变量**: 若未打开任何混杂/对撞路径，仅降低精度（非所有处理后变量都是坏控制，且在特定样本选择 $W=1$ 时控制 $Z$ 反而可阻断对撞路径）

### 4.3 “坏”的控制变量与回归局限
- **过度控制偏误**: 控制因果链上的中介变量 $X \to [Z] \to Y$ 或其后代 $M \to [Z]$，会阻断总因果效应
- **对撞偏误 (Collider Bias)**: 控制 $X$ 与 $Y$（或 $U$）的共同结果 $X \to [Z] \leftarrow Y$ 或 $X \to [Z] \leftarrow U \to Y$，会打开非因果路径导致样本选择偏差
- **回归分析局限**: 自动按协变量方差加权，层内缺乏处理或控制组样本时会自动赋予 0 权重（丢弃样本）；可借助匹配方法或 DID 改进

  <script>
    (function () {
      // 检测 iOS / iPadOS / macOS AppleWebKit 内核（包含 Notion App 内置 WKWebView 与 Safari）
      const ua = navigator.userAgent || '';
      const isAppleWebKit = /AppleWebKit/i.test(ua) && (!/Chrome|Chromium|Edg|OPR/i.test(ua) || /iPhone|iPad|iPod/i.test(ua));
      if (isAppleWebKit) {
        document.documentElement.classList.add('is-webkit');
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark' || (!params.get('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('mm-dark');
      }

      const { Transformer, Markmap, deriveOptions } = window.markmap;
      const transformer = new Transformer();

      const rawMd = document.getElementById('md-source').textContent.trim();
      const { root } = transformer.transform(rawMd);

      const options = deriveOptions({
        colorFreezeLevel: 2,
        maxWidth: 420,
        initialExpandLevel: 3,
        duration: 250
      });

      const svgEl = document.getElementById('mindmap');
      const mm = Markmap.create(svgEl, options, root);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => {
          mm.setData(root);
          mm.fit();
        });
      }

      function setFoldRecursive(node, maxDepth, currentDepth) {
        if (!node) return;
        node.payload = node.payload || {};
        node.payload.fold = currentDepth >= maxDepth ? 1 : 0;
        if (node.children) {
          node.children.forEach(c => setFoldRecursive(c, maxDepth, currentDepth + 1));
        }
      }

      document.getElementById('btn-fit').addEventListener('click', () => mm.fit());
      document.getElementById('btn-expand').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 99, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-collapse').addEventListener('click', () => {
        setFoldRecursive(mm.state.data, 2, 1);
        mm.renderData();
        setTimeout(() => mm.fit(), 280);
      });
      document.getElementById('btn-theme').addEventListener('click', () => {
        document.documentElement.classList.toggle('mm-dark');
      });
    })();
  </script>
